[project]
name = "campo-magnetico"
version = "0.1.0"
description = "Laboratório virtual (Streamlit + Plotly) para medir o campo magnético B a partir da força magnética F = q v × B."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "plotly>=5.15",
    "streamlit>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
